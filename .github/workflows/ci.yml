name: CI

# Integración continua de Óleo & Lienzo.
#
# Cada push y cada pull request ejecuta la misma comprobación que se hace en
# local: estilo, pruebas del backend contra PostgreSQL real y compilación del
# frontend. Si algo se rompe, se ve aquí antes de desplegar.

on:
  push:
    branches: [main, completar-proyecto]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Si se empuja dos veces seguidas, se cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · estilo y pruebas
    runs-on: ubuntu-latest

    # Las pruebas corren contra un PostgreSQL de verdad, no solo SQLite:
    # así se detectan las diferencias de dialecto antes del despliegue.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oleo
          POSTGRES_PASSWORD: oleo
          POSTGRES_DB: oleo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar el estilo (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Ejecutar las pruebas sobre SQLite
        env:
          # Clave de un solo uso para la ejecución de CI: no es ningún secreto
          # real y el entorno no es de producción.
          JWT_SECRET_KEY: clave-solo-para-ci-no-es-un-secreto
        run: pytest -q

      - name: Ejecutar las mismas pruebas sobre PostgreSQL
        env:
          JWT_SECRET_KEY: clave-solo-para-ci-no-es-un-secreto
          TEST_DATABASE_URL: postgresql+psycopg://oleo:oleo@localhost:5432/oleo_test
        run: pytest -q

      - name: Comprobar que el script SQL sigue en sintonía con el ORM
        env:
          JWT_SECRET_KEY: clave-solo-para-ci-no-es-un-secreto
        run: |
          # Cada generación produce hashes bcrypt distintos, porque la sal es
          # aleatoria. Se enmascaran en ambas versiones para que la comparación
          # detecte solo cambios reales del esquema.
          ENMASCARAR='s/\$2[aby]\$[0-9]\{2\}\$[A-Za-z0-9.\/]\{53\}/BCRYPT_HASH/g'

          git show HEAD:backend/sql/schema_postgresql.sql \
            | sed "$ENMASCARAR" > /tmp/esquema-versionado.sql

          python scripts/generar_sql.py
          sed "$ENMASCARAR" sql/schema_postgresql.sql > /tmp/esquema-generado.sql

          if ! diff -u /tmp/esquema-versionado.sql /tmp/esquema-generado.sql; then
            echo "::error::El esquema SQL no coincide con los modelos. Ejecuta scripts/generar_sql.py y súbelo."
            exit 1
          fi
          echo "El script SQL coincide con los modelos."

  frontend:
    name: Frontend · compilación
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para producción
        env:
          VITE_API_URL: https://api.ejemplo.local
        run: npm run build

      - name: Comprobar que la compilación produjo algo
        run: test -f dist/index.html

  seguridad:
    name: Seguridad · no hay secretos en el repositorio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ningún archivo .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Hay un archivo .env versionado. Solo deben subirse los .env.example"
            exit 1
          fi
          echo "Ningún .env versionado."

      - name: Ninguna clave de API en el código
        run: |
          # Prefijos de los proveedores que usa el proyecto, seguidos de algo
          # que parezca una clave de verdad. Se exige una tirada larga de
          # caracteres para no saltar con los marcadores de la documentación,
          # del estilo de `sk_test_...`.
          patron='(sk_(live|test)_[A-Za-z0-9]{16,}|gsk_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})'
          if git grep -nIE "$patron" -- ':!*.example' ':!.github/*'; then
            echo "::error::Posible credencial en el código."
            exit 1
          fi
          echo "Sin credenciales en el código."
